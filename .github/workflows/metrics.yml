name: Métricas del perfil

on:
  schedule:
    - cron: "0 6 * * *"   # una vez al día
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/**"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar tarjeta
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
          GH_USER: DannieDev
        run: python .github/scripts/metrics.py

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          git diff --cached --quiet || (git commit -m "Actualizar métricas del perfil" && git push)
